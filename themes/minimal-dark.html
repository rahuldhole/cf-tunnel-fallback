<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{SITE_NAME}} - Outage</title>
  <style>
    :root {
      --accent: {{ACCENT_COLOR}};
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      margin-left: auto;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #fff;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-top: 1rem;
    }
    .status-btn {
      display: inline-block;
      text-decoration: none;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      transition: background 0.2s;
    }
    .status-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .countdown {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="indicator"></div>
      <strong style="font-size: 0.95rem;">{{SITE_NAME}}</strong>
      <span class="badge">Error {{STATUS_CODE}}</span>
    </div>
    <h1>{{HEADING}}</h1>
    <p>{{MESSAGE}}</p>
    {{STATUS_BUTTON}}
    <div id="countdown" class="countdown"></div>
  </div>
  <script>
    (function() {
      const interval = parseInt("{{AUTO_REFRESH_SECONDS}}", 10) || 0;
      if (interval <= 0) return;
      let left = interval;
      const el = document.getElementById('countdown');
      function update() {
        if (el) el.textContent = 'Checking connectivity in ' + left + 's...';
        if (left <= 0) {
          left = interval;
          fetch(window.location.href, { method: 'HEAD', cache: 'no-store' })
            .then(res => {
              if (res.status !== 503 || res.headers.get('X-Tunnel-Fallback') !== 'active') {
                window.location.reload();
              }
            })
            .catch(() => {});
        } else {
          left--;
        }
      }
      update();
      setInterval(update, 1000);
    })();
  </script>
</body>
</html>
