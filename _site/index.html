    :root {
      --bg: #09090b;
      --sidebar: #121215;
      --border: #27272a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --cf: #f38020;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }
    @media (max-width: 860px) {
      body { flex-direction: column; overflow: auto; height: auto; }
    }
    .sidebar {
      width: 360px;
      min-width: 320px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      gap: 1.25rem;
      overflow-y: auto;
    }
    @media (max-width: 860px) {
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--cf);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
    }
    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }
    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .theme-picker {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    .theme-btn {
      background: #18181b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.5rem;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .theme-btn:hover { border-color: var(--muted); }
    .theme-btn.active {
      border-color: var(--cf);
      background: rgba(243, 128, 32, 0.1);
      color: #fff;
      font-weight: 600;
    }
    input[type="text"], textarea, select {
      background: #18181b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: inherit;
      width: 100%;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--cf);
    }
    .color-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border); border-radius: 6px; }
    .action-links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .deploy-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--cf);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.75rem;
      border-radius: 6px;
      transition: opacity 0.2s;
    }
    .deploy-btn:hover { opacity: 0.9; }
    .github-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #18181b;
      border: 1px solid var(--border);
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      padding: 0.6rem;
      border-radius: 6px;
    }
    .github-link:hover { color: #fff; border-color: var(--muted); }
    .viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
    }
    .viewport-bar {
      height: 40px;
      background: #121215;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1rem;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .circle-dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #22c55e; }

      flex: 1;
      max-width: 420px;
      margin: 0 auto;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      font-family: monospace;
      color: #71717a;
      text-align: center;
    }
    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
  </style>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">CF</div>
      <div>
        <a href="https://github.com/rahuldhole/cf-tunnel-fallback" class="brand-title">cf-tunnel-fallback</a>
        <div class="brand-subtitle">Interactive Outage Page Customizer</div>
      </div>
    </div>

    <div class="control-group">
      <label>Select Theme</label>
      <div class="theme-picker">
        <button class="theme-btn active" id="btn-minimal" onclick="setTheme('minimal-dark')">Minimal</button>
        <button class="theme-btn" id="btn-terminal" onclick="setTheme('terminal')">Terminal</button>
        <button class="theme-btn" id="btn-status" onclick="setTheme('status-diagram')">Diagram</button>
        <a href="https://github.com/rahuldhole/cf-tunnel-fallback#adding-custom-theme-files-html" target="_blank" class="theme-btn" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">Custom ↗</a>
      </div>
    </div>

    <div class="control-group">
      <label>Site Name</label>
      <input type="text" id="siteName" value="My Production App" oninput="render()">
    </div>

    <div class="control-group">
      <label>Heading</label>
      <input type="text" id="heading" value="We'll be right back" oninput="render()">
    </div>

    <div class="control-group">
      <label>Message</label>
      <textarea id="message" rows="3" oninput="render()">Our origin server is currently unreachable or undergoing scheduled maintenance.</textarea>
    </div>

    <div class="control-group">
      <label>Accent Color</label>
      <div class="color-row">
        <input type="color" id="accentColor" value="#f59e0b" oninput="syncColor(this.value)">
        <input type="text" id="accentColorText" value="#f59e0b" oninput="syncColor(this.value)">
      </div>
    </div>

    <div class="control-group">
      <label>Upstream Status</label>
      <select id="statusCode" onchange="render()">
        <option value="530">530 (Tunnel Offline / Error 1033)</option>
        <option value="502">502 (Bad Gateway / Container Down)</option>
        <option value="504">504 (Gateway Timeout)</option>
      </select>
    </div>

    <div class="action-links">
      <a href="https://deploy.workers.cloudflare.com/?url=https://github.com/rahuldhole/cf-tunnel-fallback" target="_blank" class="deploy-btn">
        <span>Deploy to Cloudflare</span>
      </a>
      <a href="https://github.com/rahuldhole/cf-tunnel-fallback" target="_blank" class="github-link">
        <span>View on GitHub ★</span>
      </a>
    </div>
  </aside>

  <main class="viewport">
    <div class="viewport-bar">
      <div class="circle-dots">

        <div class="dot dot-yellow"></div>

      </div>
      <div class="fake-url" id="fakeUrl">https://app.yourdomain.com</div>
      <span style="font-size:0.7rem; color:#22c55e;">● 503 Fallback Active</span>
    </div>
    <iframe id="previewFrame"></iframe>
  </main>

    const templates = {};
    for (const [k, v] of Object.entries(B64_THEMES)) {
      templates[k] = decodeURIComponent(escape(atob(v)));
    }

    let currentTheme = 'minimal-dark';

    function setTheme(name) {
      currentTheme = name;
      document.getElementById('btn-minimal').classList.toggle('active', name === 'minimal-dark');
      document.getElementById('btn-terminal').classList.toggle('active', name === 'terminal');
      document.getElementById('btn-status').classList.toggle('active', name === 'status-diagram');
      render();
    }

    function syncColor(val) {
      document.getElementById('accentColor').value = val;
      document.getElementById('accentColorText').value = val;
      render();
    }

    function escapeHtml(str) {
      return (str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function render() {
      const raw = templates[currentTheme];
      if (!raw) return;

      const siteName = document.getElementById('siteName').value;
      const heading = document.getElementById('heading').value;
      const message = document.getElementById('message').value;
      const accent = document.getElementById('accentColor').value;
      const code = document.getElementById('statusCode').value;

      let html = raw
        .replace(/{{SITE_NAME}}/g, escapeHtml(siteName))
        .replace(/{{HEADING}}/g, escapeHtml(heading))
        .replace(/{{MESSAGE}}/g, escapeHtml(message))
        .replace(/{{ACCENT_COLOR}}/g, accent)
        .replace(/{{STATUS_CODE}}/g, code)
        .replace(/{{RETRY_AFTER}}/g, '120')
        .replace(/{{STATUS_BUTTON}}/g, '<a href="#" class="status-btn" target="_blank">Status Page</a>')
        .replace(/{{AUTO_REFRESH_SECONDS}}/g, '0');

      const frame = document.getElementById('previewFrame');
      const doc = frame.contentDocument || frame.contentWindow.document;
      doc.open();
      doc.write(html);
      doc.close();
    }

    render();
  </script>
</body>
</html>
