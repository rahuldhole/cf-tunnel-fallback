name = "cf-tunnel-fallback"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
THEME = "status-diagram" # "minimal-dark", "terminal", or "status-diagram"
SITE_NAME = "My Service"
HEADING = "We'll be right back"
MESSAGE = "Our origin server is currently unreachable or undergoing scheduled maintenance."
ACCENT_COLOR = "#f59e0b"
RETRY_AFTER = "120"
INTERCEPT_STATUSES = "502,504,530"
STATUS_PAGE_URL = ""
BYPASS_TOKEN = ""
AUTO_REFRESH_SECONDS = "15"
